[default]
padding = 0,0,1,1
title_attr = command_title

#---------------------
# Layout and commands
#---------------------

[main]
title = -- My App Development Server --
panels = frontend,backend

[frontend]
title = Frontend
command = make -C frontend dev
fg = black
bg = #9ed4e6

[backend]
vertical = true
panels = api,database

[api]
title = API
command = make -C api dev
fg = black
bg = #aed490

[database]
vertical = true
panels = database-run,database-status
fg = black
bg = #e0a6de

[database-run]
title = Database
command = make -C database dev

[database-status]
title = Database Status
command = make -C database status
watch = 5
weight = 2


#---------------------
# Styling
#---------------------

[title]
bold = on
fg = black
bg = #aaaabc

[seperator]
fg = #dddddf
bg = #dddddf

[command_title]
bold = on
underline = on
