[default]
padding = 0,0,1,1
title_attr = command_title

#---------------------
# Layout and commands
#---------------------

[main]
title = -- Blocks Example --
panels = frontend,backend

[frontend]
title = Frontend
command = bash ./frontend.sh
fg = black
bg = #9ed4e6

[backend]
vertical = true
panels = api,database

[api]
title = API
command = bash ./api.sh
fg = black
bg = #aed490

[database]
title = Database
command = bash ./database.sh
fg = black
bg = #e0a6de
watch = 5

#---------------------
# Styling
#---------------------

[title]
bold = on
fg = black
bg = #aaaabc

[seperator]
fg = #dddddf
bg = #dddddf

[command_title]
bold = on
underline = on
