#---------------------
# Layout and commands
#---------------------

[main]
title = My App Development Server
panels = frontend,api,database-status,database-run

[frontend]
title = Frontend
command = make -C frontend dev

[api]
title = API
command = make -C api

[database-run]
title = Database
command = make -C database dev

[database-status]
title = Database Status
command = make -C database status
watch = 5
# weight = 2

#---------------------
# Styling
#---------------------

[title]
bold = on

[seperator]
fg = #888888