[main]
title = This is my time to shine
panels = frontend,backend

[frontend]
command = bash -c 'x=1; while true; do printf "\e[1;34m$x: INFO  GET /endpoint.html\e[0m\n"; (( x++ )); sleep 1; done'
title = frontend

[backend]
vertical = true
panels=api,server

[server]
command = bash -c 'x=1; while true; do echo -ne "\e[1;34m$x: INFO  GET /endpoint.html\e[0m\n"; (( x++ )); sleep 1; done'
title = server

[api]
command = bash -c 'x=1; while true; do printf "\e[1;34m$x: INFO  GET /endpoint.\e[1;35mhtml\e[0m\n"; (( x++ )); sleep 1; done'
title = api