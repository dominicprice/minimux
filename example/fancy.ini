[default]
padding = 1,0
title_attr = command_title

#---------------------
# Layout and commands
#---------------------

[main]
title = My App Development Server
panels = frontend,backend

[frontend]
title = Frontend
command = make -C frontend dev

[backend]
vertical = true
panels = api,database

[api]
title = API
command = make -C api dev

[database]
title = Database
command = make -C database dev


#---------------------
# Styling
#---------------------

[title]
bold = on

[seperator]
fg = #1f3469

[command_title]
bold = on
underline = on